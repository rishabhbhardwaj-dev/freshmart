<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FreshMart — Premium online grocery store. Browse fresh fruits, vegetables, dairy, bakery items, beverages, and snacks. Fast delivery to your doorstep.">
  <title>FreshMart — Premium Grocery Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- ── Header / Navigation ──────────────────────────── -->
  <header class="header" id="main-header">
    <div class="header-inner">
      <a href="#" class="logo" id="logo-link" onclick="app.navigate('home')">
        <span class="logo-icon">🥬</span>
        <span class="logo-text">Fresh<span class="logo-accent">Mart</span></span>
      </a>

      <div class="search-bar" id="search-bar">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search for groceries..." autocomplete="off">
      </div>

      <button class="cart-button" id="cart-button" onclick="app.toggleCart()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge" id="cart-badge">0</span>
      </button>

      <div class="user-menu" id="user-menu">
        <button class="user-button" id="login-button" onclick="app.showAuthModal()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span id="user-name-display" class="user-name-display">Login</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ── Main Content ─────────────────────────────────── -->
  <main class="main-content" id="main-content">
    <!-- Hero Section -->
    <section class="hero" id="hero-section">
      <div class="hero-content">
        <h1 class="hero-title">
          Fresh Groceries,<br>
          <span class="hero-gradient">Delivered Fast</span>
        </h1>
        <p class="hero-subtitle">Premium quality produce, dairy, bakery, and more — handpicked and delivered fresh to your doorstep.</p>
        <button class="hero-cta" id="hero-shop-btn" onclick="document.getElementById('products-section').scrollIntoView({behavior:'smooth'})">
          Shop Now
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </div>
      <div class="hero-visual">
        <div class="hero-emoji-grid">
          <span class="hero-emoji e1">🍎</span>
          <span class="hero-emoji e2">🥦</span>
          <span class="hero-emoji e3">🥛</span>
          <span class="hero-emoji e4">🥐</span>
          <span class="hero-emoji e5">🍊</span>
          <span class="hero-emoji e6">🍫</span>
        </div>
      </div>
    </section>

    <!-- Category Tabs -->
    <section class="products-section" id="products-section">
      <div class="section-header">
        <h2 class="section-title">Our Products</h2>
        <p class="section-subtitle">Handpicked for quality and freshness</p>
      </div>

      <div class="category-tabs" id="category-tabs">
        <button class="category-tab active" data-category="all" onclick="app.filterByCategory('all')">
          <span class="tab-icon">🛒</span> All
        </button>
        <!-- Tabs will be dynamically populated -->
      </div>

      <!-- Product Grid -->
      <div class="products-grid" id="products-grid">
        <!-- Products render here -->
      </div>
    </section>
  </main>

  <!-- ── Cart Sidebar ─────────────────────────────────── -->
  <div class="cart-overlay" id="cart-overlay" onclick="app.toggleCart()"></div>
  <aside class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h2 class="cart-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        Your Cart
      </h2>
      <button class="cart-close" id="cart-close-btn" onclick="app.toggleCart()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="cart-items" id="cart-items">
      <!-- Cart items render here -->
    </div>

    <div class="cart-footer" id="cart-footer">
      <div class="cart-total">
        <span>Total</span>
        <span class="cart-total-price" id="cart-total-price">$0.00</span>
      </div>
      <button class="checkout-btn" id="checkout-btn" onclick="app.showCheckout()">
        Proceed to Checkout
      </button>
    </div>
  </aside>

  <!-- ── Checkout Modal ───────────────────────────────── -->
  <div class="modal-overlay" id="checkout-modal" style="display:none;">
    <div class="modal" id="checkout-form-modal">
      <button class="modal-close" onclick="app.closeCheckout()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="modal-body" id="checkout-modal-body">
        <!-- Checkout form or confirmation renders here -->
      </div>
    </div>
  </div>

  <!-- ── Auth Modal ─────────────────────────────────────── -->
  <div class="modal-overlay" id="auth-modal" style="display:none;">
    <div class="modal auth-modal-content" id="auth-form-modal">
      <button class="modal-close" onclick="app.closeAuthModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="modal-body" id="auth-modal-body">
        <!-- Auth views (Login/Register/Forgot/Reset) render here dynamically via JS -->
      </div>
    </div>
  </div>

  <!-- ── Toast Notifications ──────────────────────────── -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ── Scripts ──────────────────────────────────────── -->
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
